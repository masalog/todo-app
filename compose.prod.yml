name: todo-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/q/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
    name: todo_postgres_data

networks:
  prod-net:
    name: todo_prod_network