services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  todo-app:
    build: .
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    env_file:
      - .env

volumes:
  postgres-data:
    name: todo_postgres_data
  postgres-test-data:
    name: todo_postgres_test_data
