<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | Todo アプリ</title>

  <link rel="stylesheet" href="/styles.css">
  <script src="/htmx.min.js"></script>
</head>

<body>
  <main class="container">
    <h1>ログイン</h1>
    <p class="subtitle">アカウントにログインしてください。</p>

    <section class="card" aria-label="ログインフォーム">
      <form class="register-form"
            hx-post="/web/users/login"
            hx-target="#login-feedback"
            hx-swap="innerHTML">

          <label>
            ユーザー名
            <input type="text"
                  name="username"
                  placeholder="ユーザー名を入力"
                  autocomplete="username"
                  required>
          </label>

          <label>
            パスワード
            <input type="password"
                  name="password"
                  placeholder="パスワードを入力"
                  autocomplete="current-password"
                  required>
          </label>

          <button type="submit" class="btn-add">
              ログイン
          </button>

      </form>

      <div id="login-feedback"
          class="login-feedback"
          aria-live="polite"></div>

      <p class="register-home"><a href="/register.html">アカウントをお持ちでない方はこちら</a></p>
      <p class="register-home"><a href="/index.html">Todo のトップへ戻る</a></p>
    </section>
  </main>
</body>
</html>
