# ------------------------------------------------------------
# H2 + Hibernate ORM Panache
# ------------------------------------------------------------

# H2 Database
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/todo

# 認証情報
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# ------------------------------------------------------------
# Hibernate
# ------------------------------------------------------------

# テーブルを自動作成
quarkus.hibernate-orm.schema-management.strategy=update

# SQLログは出力しない
quarkus.hibernate-orm.log.sql=false

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

quarkus.log.level=INFO
quarkus.log.category."com.example.todo".level=INFO

# ------------------------------------------------------------
# HTTP
# ------------------------------------------------------------

quarkus.http.port=8081

# MIMEタイプスニッフィング防止
quarkus.http.header."X-Content-Type-Options".value=nosniff

# クリックジャッキング対策
quarkus.http.header."X-Frame-Options".value=DENY

# Referer送信抑制
quarkus.http.header."Referrer-Policy".value=no-referrer

# ------------------------------------------------------------
# H2 Console
# ------------------------------------------------------------

# 公開しない
quarkus.h2.console.enabled=false

# ------------------------------------------------------------
# JAR
# ------------------------------------------------------------

# Uber JARを有効化
quarkus.package.jar.type=uber-jar