# ------------------------------------------------------------
# PostgreSQL
# ------------------------------------------------------------

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=todo
quarkus.datasource.password=todo

# ローカル
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tododb

# Docker
%docker.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/tododb

# ------------------------------------------------------------
# Hibernate
# ------------------------------------------------------------

# テーブルを自動作成
quarkus.hibernate-orm.schema-management.strategy=update

# SQLログは出力しない
quarkus.hibernate-orm.log.sql=false

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

quarkus.log.level=INFO
quarkus.log.category."com.example.todo".level=INFO

# ------------------------------------------------------------
# HTTP
# ------------------------------------------------------------

quarkus.http.port=8081

# MIMEタイプスニッフィング防止
quarkus.http.header."X-Content-Type-Options".value=nosniff

# クリックジャッキング対策
quarkus.http.header."X-Frame-Options".value=DENY

# Referer送信抑制
quarkus.http.header."Referrer-Policy".value=no-referrer

# ------------------------------------------------------------
# JAR
# ------------------------------------------------------------

# Uber JARを有効化
quarkus.package.jar.type=uber-jar