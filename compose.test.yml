name: todo-test

services:
  postgres-test:
    image: postgres:17
    env_file:
      - .env.test
    expose:
      - "5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    networks:
      - test-net

  test-runner:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env.test
    depends_on:
      - postgres-test
    command: mvn test
    networks:
      - test-net

volumes:
  postgres-test-data:
    name: todo_postgres_test_data

networks:
  test-net:
    name: todo_test_network